<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Plantilla de la imagen para compartir (1200 × 630). La usa scripts/generar-imagenes.mjs. */
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
        background:
          radial-gradient(60% 70% at 12% 18%, #ffb27a 0%, transparent 60%),
          radial-gradient(55% 60% at 88% 12%, #e66fb0 0%, transparent 60%),
          radial-gradient(70% 70% at 72% 92%, #4a5cf0 0%, transparent 62%),
          radial-gradient(60% 60% at 18% 96%, #8a3fd8 0%, transparent 60%),
          linear-gradient(160deg, #f08a6c, #5a3fc0);
      }
      .frame { display: grid; grid-template-columns: 1fr 470px; align-items: center; gap: 56px; height: 100%; padding: 0 80px; }
      .text { display: grid; gap: 30px; text-shadow: 0 2px 24px rgba(0, 0, 0, 0.22); }
      .who { display: flex; align-items: center; gap: 18px; }
      .photo {
        flex: none; width: 84px; height: 84px; border-radius: 50%;
        background: url("{{FOTO}}") center / cover;
        border: 3px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.45);
      }
      .name { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
      .site { font-size: 22px; font-weight: 500; opacity: 0.85; }
      .title { font-size: 56px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.06; }
      .window {
        border-radius: 18px; overflow: hidden; color: #1d1d1f;
        background: rgba(247, 247, 249, 0.96);
        box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.2), 0 30px 70px -20px rgba(0, 0, 0, 0.5);
      }
      .bar { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; background: #ececf1; border-bottom: 1px solid rgba(0, 0, 0, 0.09); font-size: 17px; font-weight: 600; }
      .bar i { width: 13px; height: 13px; border-radius: 50%; }
      .bar span { margin-left: 12px; }
      .body { display: grid; gap: 16px; padding: 24px 26px 28px; }
      .row { display: flex; align-items: baseline; gap: 12px; font-size: 22px; line-height: 1.25; }
      .row b { color: #0a6cff; font-weight: 700; }
      .row::before { content: "✓"; color: #1f9d55; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="text">
        <div class="who">
          <div class="photo"></div>
          <div>
            <div class="name">{{NOMBRE}}</div>
            <div class="site">{{DOMINIO}}</div>
          </div>
        </div>
        <div class="title">{{TAGLINE}}</div>
      </div>
      <div class="window">
        <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span>{{OS_NOMBRE}}</span></div>
        <div class="body">
          <div class="row"><span><b>IA aplicada</b> y automatización</span></div>
          <div class="row"><span>Desarrollo web y <b>UX</b></span></div>
          <div class="row"><span>Filmmaking y <b>color</b></span></div>
          <div class="row"><span>Beats, mezcla y mastering</span></div>
          <div class="row"><span><b>Valencia</b> · Mad Mike Prods</span></div>
        </div>
      </div>
    </div>
  </body>
</html>
